<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f766e">
  <meta name="description" content="Registro local de evidencias de soporte técnico.">
  <title>Evidencias Soporte</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <button class="icon-button" type="button" data-action="back" aria-label="Volver" hidden>‹</button>
      <div>
        <p class="eyebrow">SOPORTE TÉCNICO</p>
        <h1 id="page-title">Evidencias Soporte</h1>
      </div>
      <span class="status-dot" aria-label="Aplicación local"></span>
    </header>

    <main id="app" class="main-content" tabindex="-1"></main>

    <nav class="bottom-nav" aria-label="Navegación principal">
      <button type="button" class="nav-item is-active" data-route="home">
        <span class="nav-icon">⌂</span><span>Inicio</span>
      </button>
      <button type="button" class="nav-item" data-route="search">
        <span class="nav-icon">⌕</span><span>Buscar</span>
      </button>
      <button type="button" class="nav-item" data-route="all">
        <span class="nav-icon">▤</span><span>Registros</span>
      </button>
      <button type="button" class="nav-item" data-route="settings">
        <span class="nav-icon">⚙</span><span>Config.</span>
      </button>
    </nav>
  </div>
  <div id="toast-region" class="toast-region" aria-live="polite" aria-atomic="true"></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
